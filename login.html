
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | ZUPPO</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  color:white;
  background:linear-gradient(135deg,#020b2d,#071b59,#00152d);
}
.page{
  max-width:1200px;
  min-height:100vh;
  margin:auto;
  padding:35px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:45px;
  align-items:center;
}
.brand{padding:20px}
.logo{
  font-size:48px;
  font-weight:900;
  letter-spacing:3px;
  color:#12cafa;
}
.tagline{color:#b9c9ee;margin-top:5px}
h1{font-size:58px;line-height:1.05;margin-top:65px}
h1 span{color:#08c9ed}
.description{
  font-size:20px;
  line-height:1.6;
  color:#d1defb;
}
.features{margin-top:40px;line-height:3;font-size:18px}
.feature-icon{color:#12cafa;margin-right:12px}
.card{
  padding:38px;
  border:1px solid #087dff;
  border-radius:25px;
  background:rgba(3,15,48,.82);
  box-shadow:0 0 35px rgba(0,145,255,.2);
  text-align:center;
}
.card-logo{font-size:65px;color:#08cafa;font-weight:900}
.card h2{font-size:30px;margin:5px 0}
.subtitle{color:#b9c9ee;margin-bottom:28px}
input{
  width:100%;
  padding:17px;
  margin:9px 0;
  border:1px solid #536b9e;
  border-radius:12px;
  background:#0b1b42;
  color:white;
  font-size:16px;
  outline:none;
}
input:focus{border-color:#08cafa}
button{
  width:100%;
  padding:17px;
  margin-top:15px;
  border:0;
  border-radius:30px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}
.login-btn{
  color:white;
  background:linear-gradient(90deg,#075cff,#08cafa);
}
.google-btn{
  color:#17213b;
  background:white;
}
a{color:#08cafa;text-decoration:none}
.links{margin-top:22px;line-height:2.5}
#loginMessage{color:#ffcf70;overflow-wrap:anywhere}
@media(max-width:750px){
  .page{grid-template-columns:1fr;padding:20px;gap:15px}
  .brand{padding:10px}
  h1{font-size:38px;margin-top:25px}
  .description{font-size:16px}
  .features{display:none}
  .card{padding:25px 20px}
  .logo{font-size:36px}
}
</style>
</head>

<body>
<div class="page">

<section class="brand">
  <div class="logo">ZUPPO</div>
  <div class="tagline">Explore • Shop • Grow</div>

  <h1>Welcome<br><span>Back!</span></h1>
  <p class="description">
    Your favourite e-commerce hub is just a login away!
  </p>

  <div class="features">
    <div><span class="feature-icon">🛒</span> Explore Top Platforms</div>
    <div><span class="feature-icon">⚡</span> Discover More Choices</div>
    <div><span class="feature-icon">🚀</span> Shop Smarter, Live Better</div>
  </div>
</section>

<section class="card">
  <div class="card-logo">Z</div>
  <h2>ZUPPO</h2>
  <p class="subtitle">Login to your account</p>

  <form id="loginForm">
    <input id="email" type="email"
      placeholder="Email address" required>

    <input id="password" type="password"
      placeholder="Password" required>

    <button class="login-btn" type="submit">Login</button>
  </form>

  <p>────────── or ──────────</p>

  <button class="google-btn" id="googleLogin" type="button">
    🌐 Continue with Google
  </button>

  <div class="links">
    <a href="#" id="forgotPassword">Forgot password?</a>
    <p>Don't have an account?
      <a href="register.html">Register</a>
    </p>
  </div>

  <p id="loginMessage"></p>
</section>

</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="login.js"></script>
</body>
  </html>
